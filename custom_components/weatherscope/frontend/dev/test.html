<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeatherScope Wolken-Test</title>
<style>
html,body{margin:0;height:100%;background:#3f7fc4;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%}
#top{position:fixed;left:0;right:0;top:0;padding:12px 16px;background:rgba(10,20,40,.72);font-size:18px;line-height:1.35}
#diag{color:#ffd27a;margin-top:6px;font-size:17px;word-break:break-word}
#prev{color:#ff9a8a;margin-top:6px;font-size:16px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:14px 16px;background:rgba(10,20,40,.72);display:flex;gap:12px;flex-wrap:wrap}
button{font-size:20px;padding:14px 22px;border-radius:14px;border:0;background:#fff;color:#123;font-weight:600}
button.on{background:#ffd27a}
</style></head><body>
<canvas id="c"></canvas>
<div id="top"><div>Wolken-Test · Stand 122 · unten „1 · klein“ antippen</div><div id="diag">Diagnose: noch nicht gestartet</div><div id="prev"></div></div>
<div id="bar"><button data-l="1">1 · klein</button><button data-l="0">Stopp</button><button id="hide">Texte ausblenden</button></div>
<script>
const FRAG = `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 R, O, L, SH; uniform vec3 LB; uniform float tm, d, G, E, sd, SN, LOW; uniform vec3 lit, shd;
float hash(vec3 p) { p = fract(p * 0.3183099 + vec3(0.71, 0.113, 0.419)); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vn(vec3 p) { vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x), mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x), mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z); }
// the pattern is turned from one fineness to the next: left upright it shows the grid it is made on, as upright stripes
vec3 turn(vec3 p) { return vec3(p.x * 0.8 - p.y * 0.6, p.x * 0.6 + p.y * 0.8, p.z) * 2.03 + 11.3; }
float fbm3(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 3; i++) { s += a * vn(p); p = turn(p); a *= 0.5; } return s / 0.875; }
float bil(vec3 p) { float a = 0.5, s = 0.0; p = vec3(p.x * 0.866 - p.y * 0.5, p.x * 0.5 + p.y * 0.866, p.z); for (int i = 0; i < 4; i++) { float q = 2.0 * vn(p) - 1.0; s += a * (sqrt(q * q + 0.045) - 0.1); p = turn(p); a *= 0.5; } return s / 0.9375; } // round bulges with soft folds between them, like a cauliflower – a hard fold shows as an edge
// how dense the cloud is at a place. xs runs downwind, y upwards from the base. k = 1: with the small curls of the rim; k = 0: only the large smooth bulges
float dens(vec2 p, float k) {
  vec2 o = vec2(sd * 3.1, sd * 1.7);
  float xs = p.x * d - 0.22 * p.y, yy = max(p.y - 0.16 * G, 0.0);    // the top leans ahead; upright near the base, so the underside is level and broad
  float ex = (xs + 0.12) / (G * SH.x * (xs > -0.12 ? 1.2 : 0.95)), ey = yy / (0.8 * G * SH.y);
  float env = 1.0 - sqrt(ex * ex + ey * ey + 0.004);                          // a heap: 1 in the middle of the base, 0 at the rim
  float e2x = (xs - LB.x * G) / (G * LB.y), e2y = yy / (0.8 * G * LB.z);
  env = max(env, 1.0 - sqrt(e2x * e2x + e2y * e2y + 0.004));                  // a second heap beside or above it: a tower, a shoulder
  env *= 0.86 + 0.3 * fbm3(vec3(p * 0.8 + 5.0 + o, tm * 0.022));      // the large outline changes slowly; it is the bulges on it that work visibly
  vec2 ps = p / pow(max(G, 0.14), 0.78);                               // the bulges are sized to the cloud as it is now: a young small cloud has its own small bulges
  vec2 wp = vec2(fbm3(vec3(ps * 1.4 + o, tm * 0.07) + 3.1), fbm3(vec3(ps * 1.4 + o, tm * 0.07) + 7.7)) - 0.5;
  vec2 f = ps * 1.6 + o + wp * 0.4 - vec2(-d * tm * 0.02, tm * 0.04);  // the bulges rise slowly, fed from the upwind side
  float n = bil(vec3(f, tm * 0.1));
  float fine = bil(vec3(ps * 4.6 + o + wp * 0.6 - vec2(d * tm * 0.02, tm * 0.07), tm * 0.17));
  float dn = env * 1.3 + (n - 0.34) * 1.05 + (fine - 0.34) * mix(0.13, 0.3, k);
  dn -= (1.0 - smoothstep(0.02, 0.2, G)) * 0.6;                       // a cloud begins as a small puff out of nothing and ends as one
  dn -= E * (0.3 + 1.6 * fbm3(vec3(p * 1.5 + o + 21.0, tm * 0.05)));  // passing away: it thins unevenly, tears into shreds, and these go one by one
  // the underside keeps its height but is no ruled line: bays and hanging shreds that form and go, about half as fast as the bulges above
  float bn = (fbm3(vec3(ps.x * 2.4 + o.x - d * tm * 0.03, ps.y * 2.0 + o.y, tm * 0.075)) - 0.5) * 0.4;
  if (k > 0.5) { float frill = fbm3(vec3(ps * 14.0 + o - vec2(0.0, tm * 0.1), tm * 0.25)); dn += (frill - 0.5) * 0.14; if (R.x > 600.0) dn += (fbm3(vec3(ps * 31.0 + o + 4.0, tm * 0.3)) - 0.5) * 0.085; bn += (frill - 0.5) * 0.12 + (fbm3(vec3(ps * 6.5 + o + 9.0, tm * 0.1)) - 0.5) * 0.2; }

}
void main() {
  vec2 q = (gl_FragCoord.xy - O) / R, p = vec2((q.x - 0.5) * 2.0 * R.x / R.y * 0.82, q.y * 1.64 - 0.2);
  float D = dens(p, 1.0), xs = p.x * d, gs = pow(max(G, 0.14), 0.78);
  float soft = mix(0.05, 0.24, smoothstep(-0.2, 1.1, xs / G)) * mix(0.45, 1.0, G) + E * 0.22 + (1.0 - smoothstep(0.0, 0.3, p.y / gs)) * 0.1; // crisp where it wells up, softer where it goes and below
  if (R.x > 600.0) soft *= 0.7; float a = smoothstep(0.0, soft, D); // a very near cloud: crisper rim
  // light as on a body, not on an embossed sheet: at every place it is asked how much more cloud stands between it and the sun than here.
  // So the side turned to the sun is bright as a whole and the far side lies in a broad soft shadow, and a bulge or tower shades what is behind it
  float D0 = dens(p, 0.0), D1 = dens(p + L * 0.08 * gs, 0.0), D2 = dens(p + L * 0.3 * gs, 0.0);
  float shade = exp(-(max(0.0, D1 - D0) * 4.2 + max(0.0, D2 - D0) * 1.9) * (1.0 + 0.6 * LOW)); // a low sun: light and shadow lie further apart
  float hi = clamp((D0 - D1) * 3.2, 0.0, 1.0);                         // the flank of a bulge that faces the sun
  float l = (0.2 - 0.02 * LOW + (0.6 + 0.02 * LOW) * shade + (0.28 + 0.12 * LOW) * hi) * mix(mix(0.5, 0.86, LOW), 1.0, smoothstep(0.02, 0.1 + 0.5 * G * SH.y, p.y)); // bright above, blue-grey below, measured on the cloud's own height
  l *= 1.0 - 0.3 * SN * smoothstep(0.25, 1.0, D);                      // a cloud close to the sun is seen against the light: its body is darker …
  l = clamp(l, 0.0, 1.0);
  l = mix(l, 1.0, (1.0 - a) * 0.5);                                    // thin parts let the light through
  vec3 c = mix(shd, lit, l);
  c = mix(c, mix(vec3(1.0, 0.99, 0.95), vec3(1.0, 0.86, 0.6), LOW), SN * (1.0 - smoothstep(0.0, 0.42, D)) * 0.85); // … and its thin rim glows
  vec2 ed = min(q, 1.0 - q); a *= smoothstep(0.0, 0.06, min(ed.x, ed.y)); // nothing may touch the edge of its field
  gl_FragColor = vec4(c * a, a);
}`;
const cv = document.getElementById('c'), B = cv.getContext('2d'), diag = document.getElementById('diag');
const rnd = (a, b) => a + Math.random() * (b - a), sst = (a, b, x) => { const k = Math.max(0, Math.min(1, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
let W = 0, H = 0, DPR = 1, level = 0, SC = 0.5, MAXN = 34, t = 0, last = 0;
let FLc = null, x = null, U = null, err = '', info = '', lost = 0, flN = 0, dgF = 0, dgT = 0, dgSum = 0, stepTxt = '';
const mark = (s) => { stepTxt = s; try { localStorage.setItem('wsfx-test-step', s); } catch (e) {} };
try { const p = localStorage.getItem('wsfx-test-step'); if (p && p !== 'ok') document.getElementById('prev').textContent = 'Letzter Schritt vor dem letzten Abbruch: ' + p; localStorage.setItem('wsfx-test-step', 'ok'); } catch (e) {}
function size() { DPR = level === 3 ? Math.min(2, devicePixelRatio || 1) : 1; W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); B.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', size); size();
const yHor = () => 1.06 * H, yOf = (z) => yHor() * (1 - 1 / z);
function glInit() {
  if (x) return true; if (err) return false;
  try {
    mark('Grafik anfordern'); FLc = document.createElement('canvas'); FLc.width = 64; FLc.height = 64;
    x = FLc.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false, preserveDrawingBuffer: true }); if (!x) { err = 'WebGL nicht verfügbar'; return false; }
    FLc.addEventListener('webglcontextlost', (e) => { e.preventDefault(); lost++; });
    try { const di = x.getExtension('WEBGL_debug_renderer_info'), hp = x.getShaderPrecisionFormat(x.FRAGMENT_SHADER, x.HIGH_FLOAT); info = (di ? x.getParameter(di.UNMASKED_RENDERER_WEBGL) : 'Chip unbekannt') + ' · max ' + x.getParameter(x.MAX_TEXTURE_SIZE) + ' · highp ' + (hp && hp.precision > 0 ? hp.precision : 'nein'); } catch (e) { info = 'Info: ' + e.message; }
    mark('Wolken-Programm übersetzen (' + info + ')');
    const sh = (type, src) => { const q = x.createShader(type); x.shaderSource(q, src); x.compileShader(q); if (!x.getShaderParameter(q, x.COMPILE_STATUS)) throw new Error(x.getShaderInfoLog(q)); return q; };
    const pr = x.createProgram(); x.attachShader(pr, sh(x.VERTEX_SHADER, 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }')); x.attachShader(pr, sh(x.FRAGMENT_SHADER, FRAG));
    mark('Wolken-Programm binden'); x.linkProgram(pr); if (!x.getProgramParameter(pr, x.LINK_STATUS)) throw new Error(x.getProgramInfoLog(pr)); x.useProgram(pr);
    const buf = x.createBuffer(); x.bindBuffer(x.ARRAY_BUFFER, buf); x.bufferData(x.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), x.STATIC_DRAW);
    const al = x.getAttribLocation(pr, 'a'); x.enableVertexAttribArray(al); x.vertexAttribPointer(al, 2, x.FLOAT, false, 0, 0);
    U = {}; for (const n of ['R', 'O', 'L', 'SH', 'LB', 'tm', 'd', 'G', 'E', 'sd', 'SN', 'LOW', 'lit', 'shd']) U[n] = x.getUniformLocation(pr, n);
    return true;
  } catch (e) { err = String(e && e.message || e).slice(0, 500); x = null; return false; }
}
const FLCOUNT = 1300, FLZ0 = 0.85, FLZ1 = 13.5, flowHalf = () => (W * 1.1) * FLZ1;
function newFlow(f, first) {
  const k = Math.random();
  f.X = rnd(-1, 1) * flowHalf(); f.z = rnd(FLZ0, FLZ1); f.u = Math.random(); f.size = W * rnd(0.72, 1.02); f.sd = Math.random() * 40; f.life = rnd(200, 380); f.p = first ? Math.random() : 0; f.E0 = 0;
  if (k < 0.3) { f.sh = [rnd(0.9, 1.05), rnd(0.9, 1.1)]; f.lb = [0, 0.05, 0.05]; }
  else if (k < 0.55) { f.sh = [1.1, rnd(0.5, 0.68)]; f.lb = [rnd(-0.5, 0.5), rnd(0.4, 0.6), rnd(0.55, 0.8)]; }
  else if (k < 0.82) { f.sh = [rnd(0.85, 1.0), rnd(0.6, 0.8)]; f.lb = [rnd(-0.45, 0.35), rnd(0.42, 0.6), rnd(1.15, 1.45)]; }
  else { f.sh = [rnd(0.6, 0.8), rnd(0.5, 0.7)]; f.lb = [rnd(-0.6, 0.6), rnd(0.25, 0.4), rnd(0.4, 0.7)]; f.E0 = rnd(0.12, 0.25); f.size *= 0.82; }
}
let flows = null;
function sky() {
  const g = B.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2f6fbd'); g.addColorStop(1, '#a9cdee'); B.fillStyle = g; B.fillRect(0, 0, W, H);
  const sx = W * 0.72, sy = H * 0.3, r = Math.min(W, H) * 0.05, s = B.createRadialGradient(sx, sy, 0, sx, sy, r * 6); s.addColorStop(0, 'rgba(255,250,225,1)'); s.addColorStop(0.16, 'rgba(255,246,205,.95)'); s.addColorStop(0.3, 'rgba(255,244,200,.3)'); s.addColorStop(1, 'rgba(255,244,200,0)'); B.fillStyle = s; B.fillRect(sx - r * 6, sy - r * 6, r * 12, r * 12);
  return [sx, sy];
}
function clouds(dt) {
  if (!x || lost) return;
  const SW = Math.round(2064 * SC), SHh = Math.round(1986 * SC);
  if (FLc.width !== SW || FLc.height !== SHh) { mark('Rechenblatt ' + SW + '×' + SHh + ' anlegen'); FLc.width = SW; FLc.height = SHh; }
  if (!flows) flows = Array.from({ length: FLCOUNT }, () => { const f = {}; newFlow(f, true); return f; });
  const v = [-40, 11], XH = flowHalf(), sp = [W * 0.72, H * 0.3];
  x.uniform1f(U.d, -1); x.uniform1f(U.LOW, 0); x.uniform3f(U.lit, 1, 1, 1); x.uniform3f(U.shd, 0.48, 0.58, 0.78);
  x.disable(x.SCISSOR_TEST); x.viewport(0, 0, SW, SHh); x.clearColor(0, 0, 0, 0); x.clear(x.COLOR_BUFFER_BIT); x.enable(x.SCISSOR_TEST);
  const vis = [];
  for (const f of flows) {
    f.X += v[0] * 0.3 * dt; f.z += v[1] * 0.3 * dt / yHor(); f.p += dt / f.life; f.A = 0; f.t = null;
    if (f.p >= 1) newFlow(f, false);
    if (f.X > XH) f.X -= 2 * XH; else if (f.X < -XH) f.X += 2 * XH; if (f.z > FLZ1) f.z -= FLZ1 - FLZ0; else if (f.z < FLZ0) f.z += FLZ1 - FLZ0;
    const cw = f.size / f.z, X = W / 2 + f.X / f.z; if (X - cw / 2 > W + 30 || X + cw / 2 < -30) continue;
    const act = sst(f.u - 0.05, f.u + 0.05, Math.min(1.1, 1.5 / f.z)); if (act < 0.02) continue;
    const ch = cw * 300 / 512, yb = yOf(f.z), top = yb - ch * 0.88, hz = Math.min(1, (f.z - 1) / 10);
    f.A = (1 - sst(0.97, 1, f.p)) * (1 - 0.5 * hz) * sst(0.9, 0.97, f.z) * (1 - sst(12, 13.4, f.z)); if (f.A < 0.01) { f.A = 0; continue; }
    f.sx = X; f.cw = cw; f.ch = ch; f.top = top;
    f.G = Math.max(0.03, act * sst(0, 0.22, f.p) * (1 - 0.3 * sst(0.6, 1, f.p)) * (0.94 + 0.08 * Math.sin(t / 43 + f.sd))); f.E = Math.min(1, f.E0 + Math.pow(Math.max(0, (f.p - 0.52) / 0.45), 1.3));
    vis.push(f);
  }
  vis.sort((a, b) => b.cw - a.cw);
  vis.forEach((f, i) => {
    let tw, ox, oy;
    if (i >= MAXN) { f.A = 0; return; }
    if (i < 2) { tw = 1024; ox = i * 1032; oy = 0; }
    else if (i < 10) { const j = i - 2; tw = 512; ox = (j % 4) * 516; oy = 608 + Math.floor(j / 4) * 304; }
    else if (i < 34) { const j = i - 10; tw = 254; ox = (j % 8) * 258; oy = 1216 + Math.floor(j / 8) * 153; }
    else if (i < 98) { const j = i - 34; tw = 125; ox = (j % 16) * 129; oy = 1675 + Math.floor(j / 16) * 77; }
    else { f.A = 0; return; }
    tw = Math.floor(tw * SC); ox = Math.round(ox * SC); oy = Math.round(oy * SC);
    const rw = Math.max(24, Math.min(tw, Math.ceil(f.cw * DPR))), rh = Math.round(rw * 300 / 512); f.t = [ox, oy, rw, rh];
    const lx = sp[0] - f.sx, ly = (f.top + f.ch * 0.5) - sp[1], ll = Math.hypot(lx, ly) || 1; let ux = lx / ll, uy = Math.max(0.3, ly / ll); { const un = Math.hypot(ux, uy) || 1; ux /= un; uy /= un; }
    x.viewport(ox, oy, rw, rh); x.scissor(ox, oy, rw, rh);
    x.uniform2f(U.R, rw, rh); x.uniform2f(U.O, ox, oy); x.uniform2f(U.L, ux, uy); x.uniform2f(U.SH, f.sh[0], f.sh[1]); x.uniform3f(U.LB, f.lb[0], f.lb[1], f.lb[2]);
    x.uniform1f(U.tm, f.p * f.life * 0.42 + f.sd * 5); x.uniform1f(U.sd, f.sd); x.uniform1f(U.G, f.G); x.uniform1f(U.E, f.E); x.uniform1f(U.SN, sst(Math.max(f.cw * 0.75, W * 0.3), f.cw * 0.2, ll));
    x.drawArrays(x.TRIANGLE_STRIP, 0, 4); flN++;
  });
  vis.sort((a, b) => b.z - a.z);
  for (const f of vis) { if (!f.t) continue; const [ox, oy, rw, rh] = f.t; B.globalAlpha = f.A; B.drawImage(FLc, ox + 0.5, FLc.height - oy - rh + 0.5, rw - 1, rh - 1, f.sx - f.cw / 2, f.top, f.cw, f.ch); }
  B.globalAlpha = 1;
}
let first = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = ts; return; }
  if (ts - last < 32) return;
  const dt = Math.min(0.05, (ts - last) / 1000 || 0.03); last = ts; t += dt;
  const c0 = performance.now(); sky(); if (level > 0) { if (first === 1) mark('erstes Bild rechnen, Stufe ' + level); clouds(dt); if (first === 1) { mark('erstes Bild fertig, Stufe ' + level); first = 2; } else if (first === 2 && t > first) { first = 3; } }
  dgSum += performance.now() - c0; dgF++;
  if (ts - dgT > 1000) {
    const fps = dgF * 1000 / (ts - dgT), ms = dgSum / Math.max(1, dgF);
    if (level > 0 && x && !lost && dgF > 3) mark('ok');
    diag.textContent = 'Diagnose: Stufe ' + level + ' · ' + fps.toFixed(0) + ' Bilder/s · ' + ms.toFixed(0) + ' ms je Bild · Bildschirm ' + innerWidth + '×' + innerHeight + ' ×' + (devicePixelRatio || 1).toFixed(2) + ' · ' + (level === 0 ? 'Wolken aus' : err ? 'FEHLER: ' + err : lost ? 'Grafik verloren ' + lost + '×' : x ? 'läuft, ' + Math.round(flN / Math.max(1, dgF)) + ' Wolken je Bild, Blatt ' + FLc.width + '×' + FLc.height : 'startet …') + (info ? ' · ' + info : '');
    dgF = 0; dgSum = 0; flN = 0; dgT = ts;
  }
}
for (const b of document.querySelectorAll('button[data-l]')) b.addEventListener('click', () => {
  const l = +b.dataset.l; document.querySelectorAll('button[data-l]').forEach((q) => q.classList.toggle('on', q === b));
  if (l === 0) { level = 0; return; }
  diag.textContent = 'Diagnose: Stufe ' + l + ' startet …'; mark('Stufe ' + l + ' angetippt');
  setTimeout(() => { SC = [0, 0.5, 0.75, 1][l]; MAXN = [0, 34, 98, 98][l]; level = l; size(); first = 1; glInit(); }, 400);
});
document.getElementById('hide').addEventListener('click', (e) => { const o = document.getElementById('top'), h = o.style.display !== 'none'; o.style.display = h ? 'none' : ''; e.target.textContent = h ? 'Texte einblenden' : 'Texte ausblenden'; });
requestAnimationFrame(frame);
</script></body></html>
